# Dependency update PRs (repository hygiene, DESIGN.md §三十六).
# core/Cargo.lock is tracked; after a crate update, re-run
# scripts/make-rust-notices.sh so third_party/rust-crates.txt matches
# (local-checks and CI fail otherwise).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
